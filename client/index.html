    <script>
      // Runs before first paint: apply the theme (no flash), and opt into scroll animations
      // only when motion is allowed. If the animation code has not started within 4s
      // (slow network, blocked script), drop the class so no content stays hidden.
      (function () {
        var d = document.documentElement, t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        d.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !/^\/(settings|admin)(\/|$)/.test(location.pathname)) {
          d.classList.add("motion");
          setTimeout(function () { if (!d.classList.contains("motion-ready")) d.classList.remove("motion"); }, 4000);
        }
      })();
    </script>
